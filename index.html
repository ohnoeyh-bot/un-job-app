<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UN 공고</title>
<meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13181a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UN 공고">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ec; --paper: #fffdf8; --ink: #1c2321; --muted: #6a706d; --line: #e3dfd3;
  --accent: #2f6b4f; --accent-soft: #e4efe8;
  --good: #2f7d4f; --good-bg: #e3f1e7; --mid: #8a6a12; --mid-bg: #f6eed6; --ref: #3f6a9a; --ref-bg: #e6eef7;
  --hot: #b4412f; --hot-bg: #f8e5e0; --star: #a86a00;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: Inter, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13181a; --paper: #1b2224; --ink: #e8e6df; --muted: #9aa19e; --line: #2b3335;
    --accent: #7cc49d; --accent-soft: #1d3329;
    --good: #86d0a4; --good-bg: #1d3328; --mid: #e3c46e; --mid-bg: #352d17; --ref: #8db7e6; --ref-bg: #1c2a3a;
    --hot: #f0907e; --hot-bg: #3a221d; --star: #f2b94a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55;
  padding-bottom: env(safe-area-inset-bottom); }
a { color: var(--accent); }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top); }
.bar { max-width: 640px; margin: 0 auto; padding: 12px 16px 10px; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 20px; }
.brand b { color: var(--accent); font-weight: 600; }
.status { font-size: 12px; color: var(--muted); margin-top: 2px; }
.focus { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); padding: 3px 9px; border-radius: 6px; }

h2.sec { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 26px 0 12px;
  display: flex; align-items: center; gap: 10px; }
h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 14px; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.t-good { color: var(--good); background: var(--good-bg); }
.t-mid { color: var(--mid); background: var(--mid-bg); }
.t-ref { color: var(--ref); background: var(--ref-bg); }
.t-new { color: #fff; background: var(--accent); }
.t-hot { color: var(--hot); background: var(--hot-bg); }
.t-plain { color: var(--muted); background: var(--bg); }
.card h3 { font-size: 17px; line-height: 1.4; margin: 0 0 4px; font-weight: 700; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; }
.org { font-size: 13px; color: var(--muted); }
.star { margin-top: 10px; font-size: 14px; color: var(--star); font-weight: 600; }
.star span { color: var(--muted); font-weight: 400; }

details.more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
details.more summary { font-size: 14px; color: var(--muted); cursor: pointer; list-style: none; padding: 4px 0; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
.blk { margin-top: 10px; }
.blk b { display: block; font-size: 12px; letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }
.blk p { margin: 0; font-size: 15px; }
.blk small { color: var(--muted); }
.blk ul { margin: 0; padding: 0; list-style: none; font-size: 15px; }
.blk li { padding: 1px 0; }

.go { display: flex; justify-content: center; align-items: center; margin-top: 12px; padding: 11px; border-radius: 12px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; }
@media (prefers-color-scheme: dark) { .go { color: #10201a; } }

details.group > summary { list-style: none; cursor: pointer; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary h2.sec::before { content: "▸"; }
details.group[open] > summary h2.sec::before { content: "▾"; }
.note { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
/* 자세히 보기 화면 */
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns .go { flex: 1; margin-top: 0; }
.go.sub { background: var(--accent-soft); color: var(--accent); }
#sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  transform: translateY(100%); transition: transform .22s ease-out; }
#sheet.show { transform: none; }
.sbar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.sbar .in { max-width: 680px; margin: 0 auto; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.sbar button { font: inherit; font-size: 15px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 8px 6px; cursor: pointer; }
.sbar .t { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbody { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
.sbody h2.dt { font-size: 21px; line-height: 1.35; margin: 6px 0 4px; word-break: keep-all; overflow-wrap: anywhere; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 8px; margin: 14px 0; }
.box > b { display: block; font-size: 12px; letter-spacing: .08em; color: var(--accent); margin-bottom: 8px; }
.kp { margin-bottom: 10px; }
.kp i { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
.kp p { margin: 0 0 4px; font-size: 15px; padding-left: 10px; border-left: 2px solid var(--accent-soft); }
table.facts { width: 100%; border-collapse: collapse; font-size: 14px; }
table.facts th { text-align: left; color: var(--muted); font-weight: 500; padding: 5px 10px 5px 0; white-space: nowrap; vertical-align: top; width: 1%; }
table.facts td { padding: 5px 0; overflow-wrap: anywhere; }
.doc { font-size: 15.5px; line-height: 1.65; overflow-wrap: anywhere; }
.doc h4 { font-size: 16px; margin: 20px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.doc h4:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.doc h5 { font-size: 15px; margin: 14px 0 4px; color: var(--accent); }
.doc p { margin: 0 0 6px; }
.doc p.li { padding-left: 14px; text-indent: -14px; }
.doc p.nt { font-size: 14px; color: var(--muted); }
.doc .row { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.doc .row span:first-child { font-weight: 600; }
.file { border-top: 1px solid var(--line); padding: 10px 0; }
.file:first-of-type { border-top: 0; }
.file .fn { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.file .fm { font-size: 13px; color: var(--muted); margin-top: 2px; }
.file img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
.file details { margin-top: 8px; }
.file summary { font-size: 14px; color: var(--accent); cursor: pointer; padding: 4px 0; }
.file .doc { margin-top: 8px; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.src { font-size: 12px; color: var(--muted); margin-top: 16px; }
.empty { color: var(--muted); text-align: center; padding: 48px 8px; font-size: 15px; }
/* Claude에게 묻기 */
.ask { width: 100%; border: 0; cursor: pointer; font: inherit; background: var(--accent-soft); color: var(--accent); }
.askall { display: inline-block; margin-top: 8px; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent);
  background: none; border: 1px solid var(--accent-soft); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.memo textarea { width: 100%; min-height: 76px; font: inherit; font-size: 14px; color: var(--ink, inherit); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: vertical; box-sizing: border-box; }
.memo p { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  z-index: 80; max-width: calc(100% - 32px); background: #1d2a24; color: #fff; font-size: 14px; line-height: 1.45; padding: 11px 15px;
  border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; width: 340px; }
#toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
#toast .go { margin-top: 10px; }
.alt { display: block; text-align: center; font-size: 13px; color: var(--muted); margin: 6px 0 0; background: none; border: 0; font-family: inherit; cursor: pointer; width: 100%; padding: 4px; }
/* 챗봇 */
#chat { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .22s ease-out; }
#chat.show { transform: none; }
#chat .sbar .in { max-width: 680px; }
#clog { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#clog .in { max-width: 680px; margin: 0 auto; padding: 14px 14px 8px; }
.msg { margin: 0 0 12px; font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.msg.u { margin-left: 18%; background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
@media (prefers-color-scheme: dark) { .msg.u { color: #10201a; } }
.msg.a { background: var(--paper); border: 1px solid var(--line); padding: 10px 14px; border-radius: 16px 16px 16px 4px; }
.msg.a p { margin: 0 0 6px; } .msg.a p:last-child { margin-bottom: 0; }
.msg.a .li { padding-left: 14px; text-indent: -14px; }
.msg.a h6 { font-size: 15px; margin: 10px 0 4px; }
.msg.a.wait::after { content: "생각하는 중…"; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.chips button { font: inherit; font-size: 14px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
#cform { border-top: 1px solid var(--line); background: var(--bg); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
#cform .in { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#cin { flex: 1; font: inherit; font-size: 16px; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 12px; resize: none; max-height: 140px; min-height: 42px; box-sizing: border-box; }
#csend { font: inherit; font-weight: 600; font-size: 15px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; padding: 10px 14px; cursor: pointer; }
#csend:disabled { opacity: .45; }
.pass { display: flex; gap: 8px; margin: 6px 0 12px; }
.pass input { flex: 1; font: inherit; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: inherit; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><b>UN</b> 커리어 공고</div>
  <div class="status" id="status">불러오는 중…</div>
  <div class="focus" id="focus" hidden></div>
  <div><button class="askall" id="askall" hidden>💬 전체 공고 물어보기</button></div>
</div></header>
<div id="toast" role="status"></div>
<div id="chat" aria-hidden="true">
  <div class="sbar"><div class="in"><button id="cclose">‹ 닫기</button><div class="t" id="ctitle"></div><button id="cnew">새 대화</button></div></div>
  <div id="clog"><div class="in" id="cmsgs"></div></div>
  <form id="cform"><div class="in"><textarea id="cin" rows="1" placeholder="공고에 대해 물어보세요" enterkeyhint="send"></textarea><button id="csend" type="submit">보내기</button></div></form>
</div>
<main class="wrap" id="main"></main>
<div id="sheet" aria-hidden="true">
  <div class="sbar"><div class="in"><button id="close">‹ 목록</button><div class="t" id="stitle"></div></div></div>
  <div class="sbody" id="sbody"></div>
</div>

<script>
const LV = { good: ["t-good", "🟢 지금 지원 추천"], mid: ["t-mid", "🟡 지원 가능·참고"], ref: ["t-ref", "🔵 아직 자격 미달"] };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kstToday = () => { const d = new Date(Date.now() + 9 * 3600e3); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); };
const day = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const diff = (s) => Math.round((day(s) - kstToday()) / 864e5);
const md = (s) => { const [, m, d] = s.split("-"); return `${+m}/${+d}`; };

function dTag(j) {
  if (j.info) return `<span class="tag t-plain">설명회·행사</span>`;
  if (!j.deadline) return `<span class="tag t-plain">마감 확인 필요</span>`;
  const n = diff(j.deadline);
  const txt = n === 0 ? "오늘 마감" : `D-${n}`;
  return `<span class="tag ${n <= 7 ? "t-hot" : "t-plain"}">마감 ${md(j.deadline)} · ${txt}${j.deadline_from_body ? " (본문 기준)" : ""}</span>`;
}

function card(j) {
  const lv = LV[j.level] || ["t-plain", ""];
  const isNew = j.first_seen && diff(j.first_seen) >= -2;
  const tags = [
    isNew ? `<span class="tag t-new">NEW</span>` : "",
    `<span class="tag ${lv[0]}">${j.info ? "🟡 참고" : lv[1]}</span>`,
    dTag(j),
    j.intern ? `<span class="tag t-plain">Intern</span>` : "",
  ].join("");
  const where = [j.org, j.location, j.grade].filter(Boolean).join(" · ");
  const checks = (j.checks || []).map((c) => `<li>${esc(c)}</li>`).join("");
  const checkHead = j.level === "ref" && j.opens ? `🔒 언제 열리나 — ${esc(j.opens)}` : "✅ 자격";
  return `<article class="card">
    <div class="tags">${tags}</div>
    <h3>${esc(j.title)}</h3>
    <div class="org">${esc(where)}${j.program ? ` · <i>${esc(j.program)}</i>` : ""}</div>
    ${j.star ? `<div class="star">⭐ 지원해 볼 만함 <span>· ${esc(j.star_reason)}</span></div>` : ""}
    <details class="more"><summary>강의 설명 · 자격 보기</summary>
      ${j.lecture ? `<div class="blk"><b>📖 강의에서</b><p>${esc(j.lecture)} <small>(${esc(j.refs)})</small></p></div>` : ""}
      ${j.plan ? `<div class="blk"><b>🧭 내 설계에서</b><p>${esc(j.plan)}</p></div>` : ""}
      ${j.french ? `<div class="blk"><b>🇫🇷 불어</b><p>${esc(j.french)}</p></div>` : ""}
      ${checks ? `<div class="blk"><b>${checkHead}</b><ul>${checks}</ul></div>` : ""}
      <div class="blk"><small>출처: ${esc(j.source)}</small></div>
    </details>
    <div class="btns">
      ${j.detail ? `<a class="go" href="#d=${esc(j.detail)}" data-detail="${esc(j.detail)}">자세히 보기</a>` : ""}
      ${j.url ? `<a class="go ${j.detail ? "sub" : ""}" href="${esc(j.url)}" target="_blank" rel="noopener">${j.detail ? "원문" : "공고 보기"}</a>` : ""}
    </div>
  </article>`;
}

function render(data) {
  const live = data.jobs.filter((j) => !j.deadline || diff(j.deadline) >= 0);
  const order = (a, b) => (b.star - a.star) || (a.deadline || "9999").localeCompare(b.deadline || "9999") || (b.score - a.score);
  const now = live.filter((j) => j.level !== "ref" && !j.info).sort(order);
  const events = live.filter((j) => j.info).sort(order);
  const later = live.filter((j) => j.level === "ref").sort(order);

  document.getElementById("status").textContent = `${data.updated} 업데이트 · 열린 공고 ${live.length}건`;
  const f = document.getElementById("focus");
  if (data.focus) { f.hidden = false; f.textContent = `${md(data.focus.until)}까지 ${data.focus.label} 표시`; }

  let h = "";
  h += `<h2 class="sec">지금 지원할 수 있는 공고 ${now.length}</h2>`;
  h += now.length ? now.map(card).join("") :
    `<div class="empty">지금 열린 공고가 없어요.<br>새 공고가 올라오면 텔레그램으로 한 줄 알려 드려요.</div>`;
  if (events.length) h += `<h2 class="sec">설명회·행사 ${events.length}</h2>` + events.map(card).join("");
  if (later.length) h += `<details class="group"><summary><h2 class="sec">아직 자격 미달 · 미리 보기 ${later.length}</h2></summary>
    <p class="note">경력·학위가 생기면 지원할 수 있는 공고. 공고 읽는 연습용.</p>${later.map(card).join("")}</details>`;
  document.getElementById("main").innerHTML = h;
}


// ---------------------------------------------------------------- 자세히 보기
const JOBS = {};
const linkify = (t) => esc(t).replace(/https?:\/\/[^\s<>"')]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function blocks(list) {
  return (list || []).map((b) => {
    const x = linkify(b.x);
    if (b.t === "h1") return `<h4>${x}</h4>`;
    if (b.t === "h2") return `<h5>${x}</h5>`;
    if (b.t === "li") return `<p class="li">${x}</p>`;
    if (b.t === "note") return `<p class="nt">${x}</p>`;
    if (b.t === "row") return `<div class="row">${b.x.split(" | ").map((c) => `<span>${linkify(c)}</span>`).join("")}</div>`;
    return `<p>${x}</p>`;
  }).join("");
}
function detailHtml(j, d) {
  const askBtn = CHAT_URL
    ? `<button class="go ask" data-chat="job">💬 이 공고 물어보기</button><button class="alt" data-ask="1">Claude 앱으로 넘기기</button>`
    : `<button class="go ask" data-ask="1">💬 이 공고 Claude에게 묻기</button>`;
  let h = `<div class="tags">${dTag(j)}</div><h2 class="dt">${esc(j.title)}</h2>${askBtn}`;
  if (d.error) h += `<div class="box"><b>안내</b><p>${esc(d.error)}</p></div>`;
  const kp = Object.entries(d.key || {});
  if (kp.length) h += `<div class="box"><b>핵심 정리 · 원문 줄 그대로</b>${kp.map(([k, v]) =>
    `<div class="kp"><i>${esc(k)}</i>${v.map((x) => `<p>${linkify(x)}</p>`).join("")}</div>`).join("")}</div>`;
  h += `<div class="box"><b>기본 정보</b><table class="facts">${(d.facts || []).map(([k, v]) =>
    `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></div>`;
  if ((d.body || []).length) h += `<div class="box"><b>공고 본문</b><div class="doc">${blocks(d.body)}</div></div>`;
  if ((d.links || []).length) h += `<div class="box"><b>본문 속 링크</b>${d.links.map((l) =>
    `<p class="kp"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></p>`).join("")}</div>`;
  if ((d.files || []).length) h += `<div class="box"><b>첨부파일 ${d.files.length}</b>${d.files.map((f) => `
    <div class="file"><div class="fn">${esc(f.name)}</div>
      <div class="fm">${f.kind ? esc(f.kind.toUpperCase()) + " · " : ""}<a href="${esc(f.url)}" target="_blank" rel="noopener">내려받기</a>${f.note ? " · " + esc(f.note) : ""}</div>
      ${f.kind === "image" ? `<img src="${esc(f.url)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      ${f.body ? `<details><summary>파일 내용 펼치기 (${f.body.length}줄)</summary><div class="doc">${blocks(f.body)}</div></details>` : ""}
    </div>`).join("")}</div>`;
  h += askBtn;
  h += `<details class="box memo"><summary><b style="display:inline">내 상황 메모 · Claude에게 같이 전달</b></summary>
    <p>한 번 적어 두면 이 휴대폰에 저장되고, 모든 공고 질문에 같이 붙어요.</p>
    <textarea id="memo" placeholder="예: 2027년 8월 학부 졸업 예정, 불어·영어 가능, 겨울방학에만 출국 가능, 관심 지역 불어권 아프리카">${esc(getMemo())}</textarea></details>`;
  if (j.url) h += `<a class="go" href="${esc(j.url)}" target="_blank" rel="noopener">원문 공고 열기</a>`;
  h += `<p class="src">${esc(d.fetched)} 수집 · 문장은 원문 그대로 두고 줄만 나눴어요. 중요한 내용은 원문으로 한 번 더 확인하세요.</p>`;
  return h;
}
const sheet = document.getElementById("sheet");
function openDetail(name, push = true) {
  const j = JOBS[name];
  if (!j) return;
  document.getElementById("stitle").textContent = j.title;
  document.getElementById("sbody").innerHTML = `<p class="empty">불러오는 중…</p>`;
  sheet.classList.add("show"); sheet.setAttribute("aria-hidden", "false"); sheet.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (push) history.pushState({ d: name }, "", "#d=" + name);
  fetch(`details/${name}.json`, { cache: "no-store" }).then((r) => r.json())
    .then((d) => { CUR = { j, d }; document.getElementById("sbody").innerHTML = detailHtml(j, d); })
    .catch(() => { document.getElementById("sbody").innerHTML = `<p class="empty">상세를 불러오지 못했어요.</p>`; });
}
function closeDetail() {
  CUR = null;
  sheet.classList.remove("show"); sheet.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-detail]");
  if (a) { e.preventDefault(); openDetail(a.dataset.detail); }
});
document.getElementById("close").addEventListener("click", () => {
  if (history.state && history.state.d) history.back(); else { closeDetail(); history.replaceState(null, "", location.pathname); }
});
window.addEventListener("popstate", (e) => {
  const st = e.state || {};
  if (!st.c) closeChat();
  if (st.d) { if (!(CUR && CUR.j.detail === st.d && sheet.classList.contains("show"))) openDetail(st.d, false); } else closeDetail();

});

// ---------------------------------------------------------------- Claude에게 묻기
// API 키 없이: 공고 자료 전체를 복사하고 Claude 새 대화를 연다 → 붙여넣으면 그 대화 내내 자료를 기억함
let CUR = null, DATA = null;
const MEMO_KEY = "unjob-memo";
function getMemo() { try { return localStorage.getItem(MEMO_KEY) || ""; } catch { return ""; } }
function setMemo(v) { try { localStorage.setItem(MEMO_KEY, v); } catch {} }
document.addEventListener("input", (e) => { if (e.target.id === "memo") setMemo(e.target.value); });

const todayStr = () => kstToday().toISOString().slice(0, 10);
const RULES = (what) => `아래는 내가 지원을 검토 중인 ${what} 자료야. 이 대화가 끝날 때까지 이 자료 전체를 기억하고, 내 질문에는 이 자료를 근거로 답해줘.
- 자료에 없는 내용은 지어내지 말고 "공고에 없음"이라고 말해줘. 일반 지식으로 보충할 때는 "(일반 정보)"라고 표시해줘.
- 날짜·기간·자격·제출 서류처럼 중요한 건 원문 문장을 그대로 인용해줘.
- 한국어로, 짧고 직설적으로 답해줘.
- 오늘 날짜: ${todayStr()}`;
const txt = (list) => (list || []).map((b) => b.t === "h1" ? `\n## ${b.x}` : b.t === "h2" ? `### ${b.x}` : b.t === "li" ? `- ${b.x}` : b.x).join("\n");
function jobMeta(j) {
  const L = [];
  L.push(`제목: ${j.title}`);
  [["기관", j.org], ["출처", j.source], ["근무지", j.location], ["직급·유형", j.grade], ["게시일", j.posted],
   ["마감", j.deadline ? j.deadline + (j.deadline_from_body ? " (본문에서 찾은 날짜)" : "") : "목록에 없음"], ["원문 주소", j.url]]
    .forEach(([k, v]) => v && L.push(`${k}: ${v}`));
  if (j.program) L.push(`프로그램 분류: ${j.program}`);
  if (j.lecture) L.push(`수업에서 들은 설명: ${j.lecture}${j.refs ? ` (${j.refs})` : ""}`);
  if (j.plan) L.push(`내 진로 설계상 위치: ${j.plan}`);
  if ((j.checks || []).length) L.push(`자격 자동 판정(✓ 충족 / ✗ 미충족 / · 직접 확인):\n${j.checks.map((c) => "  " + c).join("\n")}`);
  if (j.opens) L.push(`자격이 열리는 시점: ${j.opens}`);
  if (j.french) L.push(`불어 관련: ${j.french}`);
  if (j.star) L.push(`봇 판단: ⭐ 지원해 볼 만함 — ${j.star_reason}`);
  return L.join("\n");
}
function jobContext(j, d) {
  const memo = getMemo().trim();
  let t = RULES("공고") + "\n\n";
  t += `[내 상황]\n${memo || "(메모 없음 — 아래 자격 자동 판정 참고)"}\n\n`;
  t += `[공고 정보]\n${jobMeta(j)}\n\n`;
  const kp = Object.entries(d.key || {});
  if (kp.length) t += `[핵심 줄 (원문 그대로)]\n${kp.map(([k, v]) => `${k}:\n${v.map((x) => "  " + x).join("\n")}`).join("\n")}\n\n`;
  if ((d.body || []).length) t += `[공고 본문 전체]\n${txt(d.body)}\n\n`;
  (d.files || []).forEach((f) => {
    t += `[첨부파일: ${f.name}]\n${f.body ? txt(f.body) : `(내용 없음 — ${f.note || "글자를 뽑지 못함"}) 주소: ${f.url}`}\n\n`;
  });
  if ((d.links || []).length) t += `[본문 속 링크]\n${d.links.map((l) => `${l.name}: ${l.url}`).join("\n")}\n\n`;
  t += "자료 끝. 위 내용을 다 읽었으면 \"공고 자료를 읽었어요\"라고만 짧게 답하고, 내 질문을 기다려줘.";
  return t;
}
function listContext(data) {
  const live = data.jobs.filter((j) => !j.deadline || diff(j.deadline) >= 0);
  const memo = getMemo().trim();
  let t = RULES(`공고 목록(${live.length}건)`) + "\n- 각 공고의 본문 전체는 여기 없어. 세부 내용이 필요하면 그 공고 앱 화면에서 따로 넘겨 달라고 말해줘.\n\n";
  t += `[내 상황]\n${memo || "(메모 없음 — 각 공고의 자격 자동 판정 참고)"}\n\n`;
  live.forEach((j, i) => { t += `[공고 ${i + 1}]\n${jobMeta(j)}\n\n`; });
  t += "자료 끝. 다 읽었으면 \"목록을 읽었어요\"라고만 짧게 답하고, 내 질문을 기다려줘.";
  return t;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 4000);
}
function copyText(t) {                                    // 클릭 순간에 바로 복사 (iOS는 버튼 누른 순간만 허용)
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(() => true, () => fallbackCopy(t));
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove(); return ok;
}
function askClaude(text) {                               // ① 누르면 복사 → ② 'Claude 열기' 버튼으로 새 대화
  copyText(text).then((ok) => {
    const el = document.getElementById("toast");
    el.innerHTML = ok
      ? `공고 자료 ${text.length.toLocaleString()}자를 복사했어요.<br>Claude 입력창에 <b>붙여넣기 → 보내기</b> 하세요.
         <a class="go" href="https://claude.ai/new" target="_blank" rel="noopener">Claude 열기</a>`
      : "복사가 막혔어요. 다시 한 번 눌러 주세요.";
    el.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 12000);
  });
}
document.addEventListener("click", (e) => {
  if (e.target.closest("#toast a")) setTimeout(() => document.getElementById("toast").classList.remove("show"), 300);
  if (e.target.closest("[data-ask]") && CUR) { e.preventDefault(); askClaude(jobContext(CUR.j, CUR.d)); }
  if (e.target.closest("#askall") && DATA) { e.preventDefault(); if (CHAT_URL) openChat("all", null); else askClaude(listContext(DATA)); }
});

// ---------------------------------------------------------------- 앱 안 챗봇
// 서버(Cloudflare Worker)가 API 키를 들고 있고, 공고 자료도 서버가 직접 읽어 붙인다.
// 대화는 공고마다 이 휴대폰에 저장 → 다시 열어도 이어서 물어볼 수 있음.
const CHAT_URL = "https://un-job-chat.ohnoeyh.workers.dev";
const PASS_KEY = "unjob-chat-pass";
let CHAT = null;                                          // { scope, name, key, msgs, busy }
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch {} },
             del(k) { try { localStorage.removeItem(k); } catch {} } };
const chatKey = (scope, name) => "unjob-chat:" + (scope === "all" ? "all" : name);
const SUGGEST = {
  job: ["파견·근무 기간이 얼마나 돼?", "내가 지원 자격이 돼?", "제출 서류를 정리해줘", "마감까지 할 일을 날짜순으로", "이 공고의 함정이나 주의할 점은?"],
  all: ["지금 나한테 제일 맞는 공고는?", "마감이 가까운 순서로 정리해줘", "방학 중에 갈 수 있는 건?", "불어를 살릴 수 있는 공고는?"],
};
function mdText(t) {                                          // 답변용 아주 작은 마크다운
  return esc(t).split("\n").map((line) => {
    let x = line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/https?:\/\/[^\s<>"')]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    if (/^#{1,6}\s/.test(line)) return `<h6>${x.replace(/^#{1,6}\s/, "")}</h6>`;
    if (/^\s*[-*•]\s/.test(line)) return `<p class="li">• ${x.replace(/^\s*[-*•]\s/, "")}</p>`;
    if (/^\s*\d+[.)]\s/.test(line)) return `<p class="li">${x.trim()}</p>`;
    return x.trim() ? `<p>${x}</p>` : "";
  }).join("");
}
function chatRender() {
  const c = CHAT, el = document.getElementById("cmsgs");
  let h = "";
  if (!ls.get(PASS_KEY)) h += `<p class="chint">처음 한 번만 챗봇 암호를 넣어 주세요. 이 휴대폰에 저장돼요.</p>
    <div class="pass"><input id="cpass" type="password" autocomplete="current-password" placeholder="챗봇 암호"><button class="go" id="cpsave" type="button" style="margin:0">저장</button></div>`;
  if (!c.msgs.length) h += `<p class="chint">${c.scope === "all" ? "지금 열린 공고 전체" : "이 공고의 본문·첨부파일 전체"}와 수업 설명, 자격 판정, 내 상황 메모를 Claude가 읽고 답해요. 공고에 없는 건 "공고에 없음"이라고 말해요.</p>
    <div class="chips">${SUGGEST[c.scope].map((q) => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  h += c.msgs.map((m, i) => m.role === "user" ? `<div class="msg u">${esc(m.content)}</div>`
    : `<div class="msg a${!m.content && c.busy && i === c.msgs.length - 1 ? " wait" : ""}">${mdText(m.content)}</div>`).join("");
  el.innerHTML = h;
  const log = document.getElementById("clog"); log.scrollTop = log.scrollHeight;
  document.getElementById("csend").disabled = c.busy;
}
function openChat(scope, name, push = true) {
  const key = chatKey(scope, name);
  let msgs = []; try { msgs = JSON.parse(ls.get(key) || "[]"); } catch {}
  CHAT = { scope, name, key, msgs, busy: false };
  const j = scope === "job" ? JOBS[name] : null;
  document.getElementById("ctitle").textContent = j ? j.title : "전체 공고 물어보기";
  const ch = document.getElementById("chat");
  ch.classList.add("show"); ch.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden";
  if (push) history.pushState({ d: scope === "job" ? name : null, c: scope }, "", location.hash || "#");
  chatRender();
}
function closeChat() {
  const ch = document.getElementById("chat");
  if (!ch.classList.contains("show")) return;
  ch.classList.remove("show"); ch.setAttribute("aria-hidden", "true");
  CHAT = null;
  if (!sheet.classList.contains("show")) document.body.style.overflow = "";
}
async function chatSend(q) {
  const c = CHAT;
  if (!c || c.busy || !q.trim()) return;
  const pass = ls.get(PASS_KEY);
  if (!pass) { toast("먼저 챗봇 암호를 넣어 주세요."); return; }
  c.msgs.push({ role: "user", content: q.trim() }, { role: "assistant", content: "" });
  c.busy = true; chatRender();
  const ans = c.msgs[c.msgs.length - 1];
  try {
    const r = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pass, scope: c.scope, detail: c.name, memo: getMemo(), messages: c.msgs.slice(0, -1) }) });
    if (r.status === 401) { ls.del(PASS_KEY); throw new Error("암호가 맞지 않아요. 다시 넣어 주세요."); }
    if (!r.ok) throw new Error(await r.text() || `서버 오류 (${r.status})`);
    const rd = r.body.getReader(), dec = new TextDecoder();
    let last = 0;
    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      ans.content += dec.decode(value, { stream: true });
      if (CHAT === c && Date.now() - last > 80) { chatRender(); last = Date.now(); }
    }
    ans.content += dec.decode();
  } catch (e) {
    ans.content += (ans.content ? "\n\n" : "") + "⚠️ " + (e.message || "연결이 끊겼어요.");
  }
  c.busy = false;
  if (!ans.content.trim()) ans.content = "⚠️ 빈 답이 왔어요. 다시 물어봐 주세요.";
  ls.set(c.key, JSON.stringify(c.msgs.slice(-40)));
  if (CHAT === c) chatRender();
}
document.getElementById("cform").addEventListener("submit", (e) => {
  e.preventDefault();
  const inp = document.getElementById("cin"); const q = inp.value; inp.value = ""; inp.style.height = "";
  chatSend(q);
});
document.getElementById("cin").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) {
    e.preventDefault(); document.getElementById("cform").requestSubmit();
  }
});
document.getElementById("cin").addEventListener("input", (e) => { e.target.style.height = ""; e.target.style.height = e.target.scrollHeight + "px"; });
document.getElementById("cclose").addEventListener("click", () => { if (history.state && history.state.c) history.back(); else closeChat(); });
document.getElementById("cnew").addEventListener("click", () => {
  if (!CHAT || CHAT.busy) return;
  CHAT.msgs = []; ls.del(CHAT.key); chatRender();
});
document.addEventListener("click", (e) => {
  const chip = e.target.closest("[data-q]"); if (chip) { chatSend(chip.dataset.q); return; }
  if (e.target.closest("#cpsave")) {
    const v = document.getElementById("cpass").value.trim();
    if (v) { ls.set(PASS_KEY, v); chatRender(); }
    return;
  }
  const b = e.target.closest("[data-chat]");
  if (b && CUR) { e.preventDefault(); openChat("job", CUR.j.detail); }
});

fetch("jobs.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((data) => {
    DATA = data; document.getElementById("askall").hidden = false;
    data.jobs.forEach((j) => { if (j.detail) JOBS[j.detail] = j; });
    render(data);
    const m = location.hash.match(/^#d=(.+)$/);           // 주소로 바로 열기 (새로고침해도 유지)
    if (m && JOBS[m[1]]) openDetail(m[1], false);
  })
  .catch(() => { document.getElementById("status").textContent = "공고를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
